---
layout: default
---
<article class="single-post">
  <a class="back-link" href="{{ '/' | relative_url }}">← voltar para o feed</a>
  <div class="single-post-heading">
    <p class="post-label">✿ {{ page.label | default: "post" }} · {{ page.category }}</p>
    <h1>{{ page.title }}</h1>
    {% if page.description %}<p>{{ page.description }}</p>{% endif %}
  </div>
  {% if page.image %}
    <img class="single-post-image" src="{{ page.image | relative_url }}" alt="{{ page.image_alt | default: page.title }}">
  {% endif %}
  <div class="post-body">{{ content }}</div>
  <a class="text-button" href="https://www.instagram.com/itsbrusilvestre/" target="_blank" rel="noopener noreferrer">mais projetos no instagram ↗</a>
</article>
